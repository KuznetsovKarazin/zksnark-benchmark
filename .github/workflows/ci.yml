name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} legacy tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned circuit tools and dependencies
        run: |
          npm ci
          npm install --global snarkjs@0.7.6
          curl --fail --location --retry 3 https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64 -o /tmp/circom
          sudo install -m 0755 /tmp/circom /usr/local/bin/circom
          circom --version
          npm list --global snarkjs --depth=0
          python -m pip install -r requirements.txt
      - name: Lint critical errors
        run: python -m flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Type check
        run: python -m mypy src/ --ignore-missing-imports
      - name: Test configs, compilation, proof generation and verification
        run: python -m pytest tests/ --junitxml=test-results.xml
      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: legacy-tests-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
