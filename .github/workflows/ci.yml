name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install system dependencies
      run: |
        sudo npm install -g snarkjs@0.7.5
        wget -q https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64 -O /tmp/circom
        sudo chmod +x /tmp/circom
        sudo mv /tmp/circom /usr/local/bin/circom
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Type check with mypy
      run: mypy src/ --ignore-missing-imports
    
    - name: Test runner validation
      run: |
        python -m src.benchmark.runner --config config/benchmark.yaml --dry-run
        
  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        sudo npm install -g snarkjs@0.7.5
        wget -q https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64 -O /tmp/circom
        sudo chmod +x /tmp/circom
        sudo mv /tmp/circom /usr/local/bin/circom
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate configuration
      run: |
        python -m src.benchmark.runner --config config/benchmark-ci.yaml --dry-run
