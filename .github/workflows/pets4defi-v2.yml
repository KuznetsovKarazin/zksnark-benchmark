name: PETs4DeFi v2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: Node ${{ matrix.node }} / npm ${{ matrix.npm }} v2 demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22"
            npm: "10"
          - node: "24"
            npm: "11"
    defaults:
      run:
        working-directory: examples/pets4defi_access_v2
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify archived economic inputs and financing scenarios
        working-directory: .
        run: python3 projects/pets4defi/scripts/test_economic_inputs.py
      - name: Reproduce attributed economic core without changing archived inputs
        working-directory: .
        run: python3 projects/pets4defi/economics/reproduce.py
      - name: Check saved revocation traces and state-dependent gas
        run: python3 scripts/check_revocation_validation.py
      - name: Check repeated traces, partition controls and exact timing model
        run: |
          python3 scripts/check_revocation_validation.py --out results/revocation_review
          python3 -m unittest discover -s scripts -p 'test_revocation*.py' -v
          python3 scripts/revocation_model.py --out /tmp/pets4defi-model-check
          diff -r results/revocation_model /tmp/pets4defi-model-check
          python3 scripts/revocation_sensitivity.py --out /tmp/pets4defi-sensitivity-check
          diff -r results/revocation_sensitivity /tmp/pets4defi-sensitivity-check
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/pets4defi_access_v2/package-lock.json
      - name: Select npm and report versions
        run: |
          npm install --global npm@${{ matrix.npm }}
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Verify all 38 saved revocation-control proofs
        run: node scripts/verify_revocation_proofs.mjs
      - name: Verify all saved review-extension proofs
        run: node scripts/verify_revocation_proofs.mjs --out results/revocation_review
      - name: Run v2 setup, positive and negative checks, and measurements
        run: npm run demo
      - name: Verify access policies, batching and matched economic accounting
        run: npm run policy
      - name: Preserve v2 measurements
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pets4defi-v2-node-${{ matrix.node }}-npm-${{ matrix.npm }}
          path: examples/pets4defi_access_v2/results/
          if-no-files-found: warn
