analysis:
  generate_plots: false
  reports:
    formats:
    - json
benchmark:
  iterations: 3
  timeout: 30
  warmup_iterations: 1
circom:
  compile_flags:
  - --r1cs
  - --wasm
  include_paths:
  - src/circuits
circuits:
  basic:
  - file: basic/multiply.circom
    inputs:
      a: 6
      b: 7
    name: multiply
environment:
  log_level: WARNING
  max_workers: 1
  output_dir: ./output
  working_dir: ./data
project:
  name: zkSNARK Benchmark Framework
  version: 0.1.0-ci
snarkjs:
  curve: bn128
  power_of_tau: 8
  protocol: groth16
